name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  guest:
    name: Windows 98 guest release asset
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install pinned Open Watcom 1.9
        shell: powershell
        run: ./scripts/bootstrap-openwatcom.ps1 -Install
      - name: Build and audit WIN98CTL.EXE
        shell: powershell
        run: ./scripts/build-guest.ps1 -Clean
      - name: Run guest and supervisor self-tests on modern Windows
        shell: powershell
        run: |
          $probe = Join-Path $env:RUNNER_TEMP 'win98ctl-modern-windows'
          New-Item -ItemType Directory -Force -Path $probe | Out-Null
          Copy-Item guest/dist/WIN98CTL.EXE,guest/dist/WIN98SUP.EXE,guest/WIN98CTL.INI -Destination $probe
          Push-Location $probe
          try {
          # WIN98CTL is a GUI subsystem program, so invoking it directly from
          # PowerShell does not wait. Start-Process gives the actual exit code.
          $result = Start-Process -FilePath '.\WIN98CTL.EXE' -ArgumentList '--self-test' -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw "WIN98CTL self-test failed with exit code $($result.ExitCode)" }
          $supervisor = Start-Process -FilePath '.\WIN98SUP.EXE' -ArgumentList '--self-test' -Wait -PassThru
          if ($supervisor.ExitCode -ne 0) { throw "WIN98SUP self-test failed with exit code $($supervisor.ExitCode)" }
          & (Join-Path $env:GITHUB_WORKSPACE 'scripts\test-supervisor-heartbeat.ps1') -ProbeDirectory $probe
            Get-Content SELFTEST.TXT
            Select-String -Path SELFTEST.TXT -Pattern 'Target compatibility: PASS', 'Result: PASS' | Out-Host
          } finally { Pop-Location }
      - name: Stage Windows 98 release asset
        shell: powershell
        run: ./scripts/stage-release.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: windows98-mcp-guest-release
          path: out/release/windows98-mcp-guest.zip
          if-no-files-found: error
          retention-days: 1

  admin:
    name: Admin (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            label: Windows x64
            platform: windows
            artifact: windows98-mcp-admin-windows-x64
          - runner: windows-11-arm
            label: Windows ARM64
            platform: windows
            artifact: windows98-mcp-admin-windows-arm64
          - runner: macos-14
            label: macOS Apple Silicon
            platform: macos
            artifact: windows98-mcp-admin-macos-arm64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      # Tauri and Vite publish platform-specific optional packages.  npm's
      # platform-local lockfile pruning makes a clean `npm ci` reject a lock
      # generated on a different release target, so resolve these optional
      # packages for the native runner before building the portable archive.
      - run: npm install --prefix admin --ignore-scripts
      - run: npm run build
      - name: Build portable Windows admin archive
        if: matrix.platform == 'windows'
        shell: powershell
        env:
          ADMIN_ARTIFACT: ${{ matrix.artifact }}
        run: |
          $ErrorActionPreference = 'Stop'
          $sidecar = 'admin/src-tauri/resources/broker-sidecar/windows98-mcp-broker.exe'
          node scripts/build-broker-sidecar.mjs $sidecar
          npm --prefix admin run tauri:build -- --no-bundle
          $stage = "out/release/$env:ADMIN_ARTIFACT"
          Remove-Item -LiteralPath $stage -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path "$stage/broker-sidecar" | Out-Null
          Copy-Item 'admin/src-tauri/target/release/windows98-mcp-admin.exe' "$stage/Windows 98 MCP Admin.exe"
          Copy-Item $sidecar "$stage/broker-sidecar/windows98-mcp-broker.exe"
          Copy-Item 'admin/README.md' "$stage/README.TXT"
          Compress-Archive -LiteralPath $stage -DestinationPath "out/release/$env:ADMIN_ARTIFACT.zip" -Force
      - name: Build portable macOS admin archive
        if: matrix.platform == 'macos'
        shell: bash
        env:
          ADMIN_ARTIFACT: ${{ matrix.artifact }}
        run: |
          set -euo pipefail
          node scripts/build-broker-sidecar.mjs admin/src-tauri/resources/broker-sidecar/windows98-mcp-broker
          (cd admin && npx --no-install tauri build --bundles app)
          app="$(find admin/src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$app"
          stage="out/release/$ADMIN_ARTIFACT"
          rm -rf "$stage" "out/release/$ADMIN_ARTIFACT.zip"
          mkdir -p "$stage"
          cp -R "$app" "$stage/"
          bundled_app="$stage/$(basename "$app")"
          sidecar="$bundled_app/Contents/Resources/resources/broker-sidecar/windows98-mcp-broker"
          test -f "$sidecar"
          # The portable archive is intentionally unsigned with a Developer ID,
          # but a valid ad-hoc signature prevents macOS treating it as damaged.
          codesign --force --sign - "$sidecar"
          codesign --force --deep --sign - "$bundled_app"
          codesign --verify --deep --strict --verbose=2 "$bundled_app"
          file "$sidecar" | grep -qi 'arm64'
          "$sidecar" broker --port 19898 > broker-sidecar.log 2>&1 &
          sidecar_pid=$!
          for _ in $(seq 1 30); do test -S /tmp/win98-mcp-19898.sock && break; sleep 0.1; done
          test -S /tmp/win98-mcp-19898.sock
          kill "$sidecar_pid"
          wait "$sidecar_pid" || true
          cp admin/README.md "$stage/README.TXT"
          ditto -c -k --sequesterRsrc --keepParent "$stage" "out/release/$ADMIN_ARTIFACT.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}-release
          path: out/release/${{ matrix.artifact }}.zip
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish npm package and GitHub release
    needs: [guest, admin]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Use an npm CLI with trusted publishing support
        run: npm install --global npm@^11.5.1
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=moderate
      - uses: actions/download-artifact@v8
        with:
          name: windows98-mcp-guest-release
          path: out/release
      - uses: actions/download-artifact@v8
        with:
          name: windows98-mcp-admin-windows-x64-release
          path: out/release
      - uses: actions/download-artifact@v8
        with:
          name: windows98-mcp-admin-windows-arm64-release
          path: out/release
      - uses: actions/download-artifact@v8
        with:
          name: windows98-mcp-admin-macos-arm64-release
          path: out/release
      - name: Publish npm package and GitHub release
        run: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
