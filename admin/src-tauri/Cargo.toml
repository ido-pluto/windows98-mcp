[package]
name = "windows98-mcp-admin"
version = "0.1.0"
description = "Local administration client for Windows 98 MCP"
authors = ["Ido S."]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[dependencies]
base64 = "0.22.1"
dirs = "6.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.9.2", features = [] }
uuid = { version = "1.18.1", features = ["v4"] }
